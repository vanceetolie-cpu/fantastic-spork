<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>桦力 BOM</title>
  <link rel="stylesheet" href="./query.css">
  <script defer src="./query.js"></script>
</head>
<body>
<header class="mast">
  <div class="shell mastinner">
    <span class="brand"><span class="mark" aria-hidden="true"></span>桦力科技</span>
  </div>
  <div class="shell hero">
    <div><h1>桦力 BOM</h1></div>
    <dl id="metrics" class="metrics" aria-label="目录统计"></dl>
  </div>
</header>
<main class="shell">
  <p id="message" class="banner" role="status" hidden></p>
  <div class="layout">
    <nav class="panel navigation" aria-label="选择机型">
      <h2>机型</h2>
      <div id="models"></div>
    </nav>
    <section class="panel list" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">物料清单</h2>
        <div class="filters">
          <select id="sections" aria-label="筛选组件"></select>
          <input id="search" type="search" placeholder="搜索料号、名称或厂家料号" aria-label="搜索物料">
          <label class="inline"><input id="with-photos" type="checkbox">仅看有图</label>
        </div>
      </div>
      <div class="scroll"><table>
        <thead><tr><th>照片</th><th>料号与描述</th><th id="rev-heading">REV</th><th>用量</th><th id="component-heading">组件</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <div class="pager"><span id="page-status" role="status"></span><div class="actions">
        <button id="previous" type="button">上一页</button><button id="next" type="button">下一页</button>
      </div></div>
    </section>
    <aside id="detail" class="panel detail" aria-label="物料详情"></aside>
  </div>
</main>
<dialog id="image-dialog">
  <div class="dialog-head"><h2 id="image-title">实物照片</h2><button class="close" type="button" aria-label="关闭实物照片">关闭</button></div>
  <div class="dialog-body"><img id="large-image" alt="物料放大照片"></div>
</dialog>
</body>
</html>
